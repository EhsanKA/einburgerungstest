<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0b6e4f"/>
<title>Einbürgerungstest Study</title>
<style>
:root {
  --bg: #f3efe6;
  --ink: #18212b;
  --muted: #5c6b7a;
  --acc: #0b6e4f;
  --card: #fffdf8;
  --ok: #0b6e4f;
  --bad: #9b2c2c;
  --cov: #1d4f91;
  --border: #e2d8c8;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  min-height: 100dvh;
  padding-bottom: calc(88px + var(--safe-bottom));
}
header {
  padding: calc(.85rem + var(--safe-top)) 1rem .6rem;
  max-width: 860px; margin: 0 auto;
}
h1 { font-size: 1.2rem; margin: 0 0 .25rem; }
.sub { color: var(--muted); font-size: .9rem; line-height: 1.35; margin: 0; }
.stats {
  max-width: 860px; margin: 0 auto; padding: 0 1rem .5rem;
  color: var(--muted); font-size: .85rem;
}
.wrap { max-width: 860px; margin: 0 auto; padding: 0 1rem 1rem; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 1rem; box-shadow: 0 8px 24px rgba(0,0,0,.05);
}
.meta { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .7rem; }
.tag {
  display: inline-block; font-size: .68rem; text-transform: uppercase;
  letter-spacing: .04em; padding: .22rem .5rem; border-radius: 999px;
}
.tag.cov { background: #e7eef8; color: var(--cov); }
.tag.uncov { background: #f3e7d8; color: #8a5a22; }
.tag.photo { background: #eee; color: #555; }
.tag.unans { background: #e8eef5; color: #3a4f66; }
.tag.wrong { background: #fdeeee; color: var(--bad); }
.tag.right { background: #eef8f2; color: var(--ok); }
.q { font-size: 1.08rem; font-weight: 650; line-height: 1.4; margin: 0 0 .9rem; }
.opts { list-style: none; padding: 0; margin: 0; display: grid; gap: .55rem; }
.opt {
  border: 1px solid #d7cdb9; border-radius: 12px; padding: .85rem .9rem;
  background: #fff; line-height: 1.35; cursor: pointer;
  touch-action: manipulation; user-select: none;
  min-height: 48px;
}
.opt:active { transform: scale(.99); }
.opt .letter { font-weight: 700; color: var(--muted); margin-right: .35rem; }
.opt.correct { border-color: #7cbc9a; background: #eef8f2; }
.opt.wrong-pick { border-color: #e2a4a4; background: #fdeeee; }
.answer-box {
  display: none; margin-top: .9rem; padding-top: .8rem;
  border-top: 1px dashed #d7cdb9; color: var(--ok); font-weight: 650; line-height: 1.4;
}
.answer-box.show { display: block; }
.note { margin-top: .65rem; color: var(--muted); font-size: .88rem; line-height: 1.4; }
mark.kw { background: #ffe566; color: inherit; padding: 0 .12em; border-radius: .2em; }
mark.kw-ans {
  background: #9dffa8; color: inherit; padding: 0 .12em; border-radius: .2em;
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px;
}
/* Bottom action bar — mobile friendly */
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  background: rgba(255,253,248,.96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  padding: .55rem .7rem calc(.55rem + var(--safe-bottom));
}
.bar-inner {
  max-width: 860px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: .45rem;
}
.bar button, .menu button, select {
  font: inherit; min-height: 44px; border-radius: 11px;
  border: 1px solid #c9d0d6; background: #fff; color: var(--ink);
  padding: .55rem .7rem; cursor: pointer; touch-action: manipulation;
}
.bar button.primary { background: var(--acc); color: #fff; border-color: var(--acc); }
.bar .row2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; }
.progress {
  grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: .82rem;
  padding-bottom: .15rem;
}
/* Top controls */
.top {
  max-width: 860px; margin: 0 auto; padding: 0 1rem .6rem;
  display: grid; gap: .45rem;
}
.top select { width: 100%; }
.top-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .45rem; }
.top-actions button.danger { color: var(--bad); border-color: #e2a4a4; }
.hidden-file { display: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(100px + var(--safe-bottom)); z-index: 60;
  background: #18212b; color: #fff; padding: .6rem .9rem; border-radius: 999px;
  font-size: .85rem; opacity: 0; pointer-events: none; transition: opacity .2s;
  max-width: 90vw;
}
.toast.show { opacity: 1; }
@media (min-width: 720px) {
  .bar-inner { grid-template-columns: auto auto 1fr auto auto; align-items: center; }
  .bar .row2 { grid-column: auto; display: contents; }
  .progress { grid-column: auto; text-align: left; }
}
</style>
</head>

<header>

</div>

const STORAGE_KEY = 'einbuergerung_progress_v1';

let i = 0;
let currentQid = null;
let showEn = false;
let showAns = false;
let picked = null;
const filterSel = document.getElementById('filter');

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1800);
}
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    return obj && typeof obj === 'object' ? obj : {};
  } catch (e) { return {}; }
}
function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}
let progress = loadProgress();

function statusOf(n) { return progress[String(n)] || 'unanswered'; }
function setStatus(n, status) {
  progress[String(n)] = status;
  saveProgress(progress);
}
function counts() {
  let unanswered = 0, wrong = 0, correct = 0;
  for (const c of DATA) {
    const s = statusOf(c.n);
    if (s === 'correct') correct++;
    else if (s === 'wrong') wrong++;
    else unanswered++;
  }
  return { unanswered, wrong, correct };
}
function statusRank(n) {
  const s = statusOf(n);
  if (s === 'unanswered') return 0;
  if (s === 'wrong') return 1;
  return 2;
}
function deck() {
  const f = filterSel.value;
  let arr = DATA.filter(c => {
    if (currentQid !== null && c.n === currentQid) return true;
    const s = statusOf(c.n);
    if (f === 'unanswered') return s === 'unanswered';
    if (f === 'wrong') return s === 'wrong';
    if (f === 'correct') return s === 'correct';
    if (f === 'covered') return c.covered;
    if (f === 'uncovered') return !c.covered;
    if (f === 'photo') return c.photo;
    return true;
  });
  arr = [...arr].sort((a, b) => {
    if (currentQid !== null) {
      if (a.n === currentQid) return -1;
      if (b.n === currentQid) return 1;
    }
    if (f === 'all') return a.n - b.n;
    if (f === 'wrong' || f === 'correct' || f === 'unanswered') return a.n - b.n;
    const sr = statusRank(a.n) - statusRank(b.n);
    if (sr) return sr;
    const cr = (a.covered ? 0 : 1) - (b.covered ? 0 : 1);
    if (cr) return cr;
    const pr = (a.photo ? 1 : 0) - (b.photo ? 1 : 0);
    if (pr) return pr;
    return a.n - b.n;
  });
  return arr;
}
function letter(idx) { return String.fromCharCode(65 + idx); }
function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function highlightKeywords(text, keywords, cls) {
  if (!keywords || !keywords.length) return escapeHtml(text);
  const sorted = [...keywords].filter(Boolean).sort((a,b) => b.length - a.length);
  const lower = text.toLowerCase();
  const ranges = [];
  const overlaps = (a,b) => !(a.end <= b.start || b.end <= a.start);
  for (const kw of sorted) {
    const k = String(kw).toLowerCase();
    if (k.length < 3) continue;
    let from = 0;
    while (from < lower.length) {
      const at = lower.indexOf(k, from);
      if (at < 0) break;
      const range = {start: at, end: at + k.length};
      if (!ranges.some(r => overlaps(r, range))) ranges.push(range);
      from = at + k.length;
    }
    if (k.length >= 4 && !k.includes(' ')) {
      const stem = k.length >= 5 ? k.slice(0, Math.min(6, k.length)) : k;
      const re = new RegExp('[A-Za-zÄÖÜäöüß0-9-]*' + stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[A-Za-zÄÖÜäöüß0-9-]*', 'gi');
      let m;
      while ((m = re.exec(text)) !== null) {
        const range = {start: m.index, end: m.index + m[0].length};
        if (!ranges.some(r => overlaps(r, range))) ranges.push(range);
      }
    }
  }
  ranges.sort((a,b) => a.start - b.start);
  const merged = [];
  for (const r of ranges) {
    if (!merged.length || r.start > merged[merged.length-1].end) merged.push(r);
    else merged[merged.length-1].end = Math.max(merged[merged.length-1].end, r.end);
  }
  let out = '', cur = 0;
  for (const r of merged) {
    out += escapeHtml(text.slice(cur, r.start));
    out += '<mark class="' + cls + '">' + escapeHtml(text.slice(r.start, r.end)) + '</mark>';
    cur = r.end;
  }
  out += escapeHtml(text.slice(cur));
  return out;
}

function render() {
  const d = deck();
  const ct = counts();
  document.getElementById('stats').textContent =
    `Not answered: ${ct.unanswered} · Wrong: ${ct.wrong} · Correct: ${ct.correct}`;

  if (!d.length) {
    document.getElementById('card').innerHTML = '<p>No questions in this filter.</p>';
    document.getElementById('progress').textContent = '0 / 0';
    currentQid = null;
    return;
  }
  if (currentQid !== null) {
    const pinnedIdx = d.findIndex(x => x.n === currentQid);
    if (pinnedIdx >= 0) i = pinnedIdx;
    else currentQid = null;
  }
  if (i >= d.length) i = 0;
  if (i < 0) i = d.length - 1;
  const c = d[i];
  currentQid = c.n;
  const st = statusOf(c.n);
  document.getElementById('progress').textContent = `${i + 1} / ${d.length} · Q${c.n}`;

  const statusTag =
    st === 'correct' ? '<span class="tag right">Correct</span>' :
    st === 'wrong' ? '<span class="tag wrong">Hard / wrong</span>' :
    '<span class="tag unans">Not answered</span>';
  const tags = [
    statusTag,
    `<span class="tag ${c.covered ? 'cov' : 'uncov'}">${c.covered ? 'Wording pack' : 'Extra'}</span>`,
    `<span class="tag">Q${c.n}</span>`
  ];
  if (c.photo) tags.push('<span class="tag photo">Photo</span>');

  const qRaw = showEn ? c.q_en : c.q_de;
  const opts = showEn ? c.opts_en : c.opts_de;
  const doHighlight = !showEn && (showAns || picked !== null);
  const qKeys = c.q_keywords && c.q_keywords.length ? c.q_keywords : (c.keywords || []);
  const aKeys = c.a_keywords && c.a_keywords.length ? c.a_keywords : (c.keywords || []);
  const q = doHighlight ? highlightKeywords(qRaw, qKeys, 'kw') : escapeHtml(qRaw);

  let optsHtml = '';
  for (let k = 0; k < opts.length; k++) {
    let cls = 'opt';
    if (showAns && k === c.correct_idx) cls += ' correct';
    if (picked !== null && picked === k && k !== c.correct_idx) cls += ' wrong-pick';
    if (picked !== null && picked === k && k === c.correct_idx) cls += ' correct';
    const optText = (doHighlight && k === c.correct_idx)
      ? highlightKeywords(opts[k], aKeys, 'kw-ans')
      : escapeHtml(opts[k]);
    optsHtml += `<li class="${cls}" data-idx="${k}" role="button" tabindex="0"><span class="letter">${letter(k)})</span>${optText}</li>`;
  }
  const chipQ = (qKeys || []).slice(0,5).map(k => '<mark class="kw">' + escapeHtml(k) + '</mark>').join(' ');
  const chipA = (aKeys || []).slice(0,5).map(k => '<mark class="kw-ans">' + escapeHtml(k) + '</mark>').join(' ');
  const kwChips = (showAns || picked !== null) && ((qKeys||[]).length || (aKeys||[]).length)
    ? `<div class="note"><b>In question:</b> ${chipQ || '—'}<br/><b>In answer:</b> ${chipA || '—'}</div>`
    : '';
  const ansRaw = showEn ? c.opts_en[c.correct_idx] : c.opts_de[c.correct_idx];
  const ansText = doHighlight
    ? `${c.correct_letter}) ${highlightKeywords(ansRaw, aKeys, 'kw-ans')}`
    : `${c.correct_letter}) ${escapeHtml(ansRaw)}`;

  document.getElementById('card').innerHTML = `
    <div class="meta">${tags.join('')}</div>
    <p class="q">${q}</p>
    <ul class="opts">${optsHtml}</ul>
    <div class="answer-box ${showAns ? 'show' : ''}">Correct: ${ansText}</div>
    ${kwChips}
    ${c.photo ? '<p class="note">Photo question — check the official PDF for the image.</p>' : ''}
  `;

  document.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      currentQid = c.n;
      const chosen = Number(el.dataset.idx);
      picked = chosen;
      showAns = true;
      setStatus(currentQid, chosen === c.correct_idx ? 'correct' : 'wrong');
      render();
    });
  });

  document.getElementById('translate').textContent = showEn ? 'German' : 'English';
  document.getElementById('answer').textContent = showAns ? 'Hide' : 'Answer';
}

function go(delta) {
  const prevId = currentQid;
  currentQid = null;
  showAns = false;
  picked = null;
  let d = deck();
  if (!d.length) { i = 0; render(); return; }
  if (delta > 0 && (filterSel.value === 'smart' || filterSel.value === 'unanswered')) {
    const unansweredIdx = d.findIndex(x => statusOf(x.n) === 'unanswered');
    const wrongIdx = d.findIndex(x => statusOf(x.n) === 'wrong');
    if (unansweredIdx >= 0) i = unansweredIdx;
    else if (wrongIdx >= 0) i = wrongIdx;
    else i = 0;
  } else {
    let idx = d.findIndex(x => x.n === prevId);
    if (idx < 0) idx = i;
    i = (idx + delta + d.length) % d.length;
  }
  currentQid = d[i].n;
  render();
}
function jumpToStart() {
  currentQid = null; showAns = false; picked = null; i = 0;
  const d = deck();
  if (d.length) currentQid = d[0].n;
  render();
}

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('translate').onclick = () => { showEn = !showEn; render(); };
document.getElementById('answer').onclick = () => { showAns = !showAns; render(); };
document.getElementById('markWrong').onclick = () => {
  if (currentQid == null) return;
  setStatus(currentQid, 'wrong');
  showAns = true;
  render();
  toast('Marked as hard/wrong');
};
document.getElementById('reset').onclick = () => {
  if (confirm('Reset ALL progress (answered/wrong/correct) on this device?')) {
    progress = {};
    saveProgress(progress);
    filterSel.value = 'smart';
    jumpToStart();
    toast('Progress reset');
  }
};
document.getElementById('exportBtn').onclick = () => {
  const payload = {
    version: 1,
    savedAt: new Date().toISOString(),
    progress
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'einbuergerung-progress.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Progress exported');
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const obj = JSON.parse(text);
    const incoming = obj.progress || obj;
    if (!incoming || typeof incoming !== 'object') throw new Error('bad file');
    progress = incoming;
    saveProgress(progress);
    filterSel.value = 'smart';
    jumpToStart();
    toast('Progress imported');
  } catch (err) {
    alert('Could not import that file.');
  }
  e.target.value = '';
};
filterSel.onchange = () => jumpToStart();

filterSel.value = 'smart';
jumpToStart();
</script>
